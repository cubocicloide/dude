services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      APP_TITLE: ${APP_TITLE:-App}
      DEBUG: ${DEBUG:-false}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_TITLE: ${VITE_APP_TITLE:-App}
        VITE_REACT_QUERY_DEVTOOLS: ${VITE_REACT_QUERY_DEVTOOLS:-false}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
