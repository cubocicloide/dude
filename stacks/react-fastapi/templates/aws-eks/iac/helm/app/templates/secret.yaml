{{- $secrets := .Values.secrets | default dict -}}
{{- if and .Values.database.enabled (not (index $secrets "DATABASE_URL")) }}
{{- fail "database.enabled is true but secrets.DATABASE_URL is empty — `dude iac ship`/`deploy` injects it from the Terraform output; set it by hand only for a bespoke deploy." }}
{{- end }}
{{- if $secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-secret
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
