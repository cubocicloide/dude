{{- if .Values.database.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-secret
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.secrets.databaseUrl }}
  {{- fail "database.enabled is true but secrets.databaseUrl is empty — set it via values-<env>.yaml or --set secrets.databaseUrl=…" }}
  {{- end }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
{{- end }}
