{{- if .Values.celeryBeat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-celery-beat
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-beat
spec:
  # A single scheduler instance — never scale beat beyond one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-beat
    spec:
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      containers:
        - name: celery-beat
          image: {{ include "app.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
          env:
            {{- include "app.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.celeryBeat.resources | nindent 12 }}
{{- end }}
