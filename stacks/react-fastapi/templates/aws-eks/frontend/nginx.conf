# SPA routing. The /api traffic is routed to the backend by the ALB Ingress
# (path-based), so nginx only needs to serve the static bundle and fall back to
# index.html for client-side routes.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
