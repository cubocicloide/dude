{{- if .Values.celery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-celery-worker
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  replicas: {{ .Values.celery.worker.replicas }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-worker
    spec:
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      containers:
        - name: celery-worker
          image: {{ include "app.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
          envFrom:
            {{- include "app.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.celery.worker.resources | nindent 12 }}
{{- end }}
