# nginx template for the `frontend` role — rendered by nginx-entrypoint.sh
# with envsubst. Only ${BACKEND}, ${SOCKETIO}, ${FRAPPE_SITE_NAME_HEADER},
# ${PROXY_READ_TIMEOUT} and ${CLIENT_MAX_BODY_SIZE} are substituted; every
# `$other` variable below is a native nginx variable.
#
# Runs unprivileged (user frappe): port 8080, pid + temp paths under /tmp,
# logs to stdout/stderr for CloudWatch.

worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream backend-server {
        server ${BACKEND} fail_timeout=0;
    }

    upstream socketio-server {
        server ${SOCKETIO} fail_timeout=0;
    }

    server {
        listen 8080;
        server_name $http_host;
        root /home/frappe/frappe-bench/sites;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        client_max_body_size ${CLIENT_MAX_BODY_SIZE};

        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin";

        location /assets {
            try_files $uri =404;
        }

        location ~ ^/protected/(.*) {
            internal;
            try_files /${FRAPPE_SITE_NAME_HEADER}/$1 =404;
        }

        location /socket.io {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Frappe-Site-Name ${FRAPPE_SITE_NAME_HEADER};
            proxy_set_header Origin $scheme://$http_host;
            proxy_set_header Host $host;
            proxy_pass http://socketio-server;
        }

        location / {
            rewrite ^(.+)/$ $1 permanent;
            rewrite ^(.+)/index\.html$ $1 permanent;
            rewrite ^(.+)\.html$ $1 permanent;

            location ~* ^/files/.*.(htm|html|svg|xml) {
                add_header Content-disposition "attachment";
                try_files /${FRAPPE_SITE_NAME_HEADER}/public/$uri @webserver;
            }

            try_files /${FRAPPE_SITE_NAME_HEADER}/public/$uri @webserver;
        }

        location @webserver {
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Frappe-Site-Name ${FRAPPE_SITE_NAME_HEADER};
            proxy_set_header Host $host;
            proxy_set_header X-Use-X-Accel-Redirect True;
            proxy_read_timeout ${PROXY_READ_TIMEOUT};
            proxy_redirect off;
            proxy_pass http://backend-server;
        }
    }
}
