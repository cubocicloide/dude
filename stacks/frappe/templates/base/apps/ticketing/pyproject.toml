[project]
name = "ticketing"
authors = [{ name = "Your Team" }]
description = "Custom ticketing extensions for Frappe Helpdesk — example app"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe-style formatting/linting defaults (mirrors the frappe codebase).
[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
  "F",   # pyflakes
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
]
ignore = [
  "E501", # line length is enforced by the formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
