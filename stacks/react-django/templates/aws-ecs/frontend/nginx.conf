# SPA serving only. The /api/*, /admin/* and /django-static/* traffic is
# routed straight to the Django backend by the ALB (path-based listener
# rules), so nginx never proxies to a backend — it just serves the static
# bundle and falls back to index.html for client-side routes. The ALB target
# group health-checks GET / and expects a 200 (index.html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
