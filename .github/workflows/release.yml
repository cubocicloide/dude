name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@cubocicloide'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Publishes every package under the `next` dist-tag (candidate channel).
      # `latest` (stable) only moves via an explicit promotion:
      #   make promote PKG=<name> [VERSION=<v>]
      # See .claude/skills/promote-stable/ and README "Releasing".
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          # GITHUB_TOKEN: git operations only (open the release PR, push tags).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN: publish to npmjs.com (automation token, repo secret).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
