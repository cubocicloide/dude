name: Greetings

# Welcome first-time contributors and point them at the docs and conventions.
# Only fires on a person's *first* issue or PR in this repo.

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a commit SHA (v3.1.0), not a moving major tag: Dependabot had
      # already bumped v1 → v3 here without renaming inputs, which is exactly
      # how this broke — v2 renamed repo-token/issue-message/pr-message to
      # snake_case, and a floating tag can move again without anyone noticing.
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >
            👋 Thanks for opening your first issue on **dude**! A couple of
            pointers so we can help quickly:

            • If this is a bug, the fastest way to file a complete report is
            `dude report` (it attaches `dude info` diagnostics for you).

            • For "how do I…?" questions, our
            [Discussions](https://github.com/cubocicloide/dude/discussions) are a
            better fit than an issue.

            • Our [docs](https://github.com/cubocicloide/dude#documentation) cover
            most workflows. A maintainer will take a look soon — thanks for the
            report!
          pr_message: >
            🎉 Thanks for your first pull request to **dude**! Please make sure
            you've skimmed
            [CONTRIBUTING.md](https://github.com/cubocicloide/dude/blob/master/CONTRIBUTING.md)
            and the PR checklist. If your change touches a published package,
            don't forget a changeset (`make changeset`). A maintainer will review
            shortly — welcome aboard!
