name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # The composed docs pages under docs/docs/stacks/ are generated from each
      # stack's `docs` manifest and committed. This fails if a manifest changed
      # without regenerating. It lives here rather than in docs.yml because the
      # composer needs every stack built, and docs.yml stays a pure mkdocs build.
      - name: Check composed docs are up to date
        run: make docs-check

      # Every stack must ship the same minimum .claude/.vscode surface, and no
      # skill may tell an agent to run a command its stack does not register —
      # the way a skill copied between stacks goes wrong. See
      # .claude/rules/006-agent-surface.md.
      - name: Check the agent surface
        run: make agent-surface-check

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Test global installation + scaffold + lint (Docker)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/dude-src:ro" \
            node:20 \
            bash -c '
              set -e
              mkdir -p /dude
              # Copy the checked-out repo into the container, excluding host-built
              # node_modules/dist/.git so the container builds everything fresh.
              tar -C /dude-src --exclude=node_modules --exclude=dist --exclude=.git -cf - . | tar -C /dude -xf -
              bash /dude/scripts/test-global-install.sh /dude
            '

      - name: Test
        run: pnpm run test

  expo-firebase-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build the monorepo
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Pack the local CLI and stack
        run: |
          mkdir -p "$RUNNER_TEMP/dude-packs"
          pnpm --dir packages/dude pack --pack-destination "$RUNNER_TEMP/dude-packs"
          pnpm --dir stacks/expo-firebase pack --pack-destination "$RUNNER_TEMP/dude-packs"

      - name: Scaffold and install a generated project
        run: |
          node packages/dude/bin/dude.mjs init --stack ./stacks/expo-firebase --yes "$RUNNER_TEMP/expo-firebase-smoke"
          node scripts/prepare-expo-smoke.mjs "$RUNNER_TEMP/expo-firebase-smoke" "$RUNNER_TEMP/dude-packs"
          pnpm exec prettier --check "$RUNNER_TEMP/expo-firebase-smoke/pnpm-workspace.yaml"
          pnpm --dir "$RUNNER_TEMP/expo-firebase-smoke" install --no-frozen-lockfile

      - name: Validate the generated project
        working-directory: ${{ runner.temp }}/expo-firebase-smoke
        run: |
          node "$GITHUB_WORKSPACE/packages/dude/bin/dude.mjs" doctor
          node "$GITHUB_WORKSPACE/packages/dude/bin/dude.mjs" review
          node "$GITHUB_WORKSPACE/packages/dude/bin/dude.mjs" test
          pnpm run export:web
