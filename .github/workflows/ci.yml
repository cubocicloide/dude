name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # The composed docs pages under docs/docs/stacks/ are generated from each
      # stack's `docs` manifest and committed. This fails if a manifest changed
      # without regenerating. It lives here rather than in docs.yml because the
      # composer needs every stack built, and docs.yml stays a pure mkdocs build.
      - name: Check composed docs are up to date
        run: make docs-check

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Test global installation + scaffold + lint (Docker)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/dude-src:ro" \
            node:20 \
            bash -c '
              set -e
              mkdir -p /dude
              # Copy the checked-out repo into the container, excluding host-built
              # node_modules/dist/.git so the container builds everything fresh.
              tar -C /dude-src --exclude=node_modules --exclude=dist --exclude=.git -cf - . | tar -C /dude -xf -
              bash /dude/scripts/test-global-install.sh /dude
            '

      - name: Test
        run: pnpm run test
