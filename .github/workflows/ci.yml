name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Test global installation (Docker)
        env:
          DUDE_TOKEN: ${{ secrets.DUDE_TOKEN }}
        run: |
          docker run --rm \
            --env DUDE_TOKEN="${DUDE_TOKEN}" \
            node:20 \
            bash -c "
              set -e
              git clone https://x-access-token:\${DUDE_TOKEN}@github.com/cubocicloide/dude.git /dude
              export GITHUB_TOKEN=\"\${DUDE_TOKEN}\"
              bash /dude/scripts/test-global-install.sh /dude
            "

      - name: Test
        run: pnpm run test
