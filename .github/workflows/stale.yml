name: Stale

# Gently age out issues and PRs that have gone quiet, so the tracker reflects
# what's actually live. Windows are generous and important work is exempt.

on:
  schedule:
    - cron: '30 1 * * *' # daily at 01:30 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          # Never age out pinned work, security reports, or roadmap items — and
          # leave anything that's assigned or attached to a milestone alone.
          exempt-issue-labels: 'pinned,security,roadmap'
          exempt-pr-labels: 'pinned,security'
          exempt-all-milestones: true
          exempt-all-assignees: true
          stale-issue-message: >
            This issue has had no activity for 60 days, so it's been marked
            stale. If it's still relevant, leave a comment or update it —
            otherwise it will be closed in 14 days. Thanks for helping keep the
            tracker tidy!
          close-issue-message: >
            Closing this as stale after a further period of no activity. If it's
            still relevant, please comment to reopen, or file a fresh report with
            `dude report`.
          stale-pr-message: >
            This pull request has had no activity for 60 days and is now marked
            stale. Rebase or comment to keep it open; otherwise it will be closed
            in 14 days.
          close-pr-message: >
            Closing this PR as stale. Feel free to reopen it when you can pick the
            work back up.
