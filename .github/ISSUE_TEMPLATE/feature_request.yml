name: 💡 Feature request
description: Suggest a new stack, command, lint check, or improvement.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe the problem before the solution —
        it helps us evaluate alternatives we might not have considered.

  - type: dropdown
    id: kind
    attributes:
      label: Type of request
      options:
        - New stack
        - New command / flag
        - New lint check
        - Template / scaffold improvement
        - IaC / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: stack
    attributes:
      label: Related stack
      description: Which stack does this concern? Choose "N/A / core" for CLI-wide requests.
      options:
        - "N/A / core"
        - react-fastapi
        - react-django
        - fastmcp
        - tauri
        - frappe
        - airflow
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not just the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like dude to do? A sketch of the command/flag/behavior is great.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or thought about.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and this hasn't already been requested.
          required: true
