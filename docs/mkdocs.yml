site_name: "dude"
site_description: "Cubocicloide's project scaffolding & code-quality CLI — multi-stack, plugin-based."
repo_url: https://github.com/cubocicloide/dude
repo_name: cubocicloide/dude

theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - toc.integrate
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: concepts.md
  # <!-- composed:stacks:start — generated by `make docs-data`, do not edit -->
  - Stacks:
      - Overview: stacks/index.md
      - airflow: stacks/airflow.md
      - fastmcp: stacks/fastmcp.md
      - frappe: stacks/frappe.md
      - react-django: stacks/react-django.md
      - react-fastapi: stacks/react-fastapi.md
      - tauri: stacks/tauri.md
  # <!-- composed:stacks:end -->
  - Command reference: commands.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
